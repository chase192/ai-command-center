<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Command Center</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>AI Command Center</h1><p>Ask three AI providers, get one combined response.</p>
<section id="login"><h2>Sign in</h2><form id="loginForm"><label>Application password <input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<section id="workspace" hidden><button id="logout" class="secondary">Sign out</button><form id="askForm"><label for="prompt">Your question</label><textarea id="prompt" maxlength="5000" rows="5" required placeholder="What should the team do next?"></textarea><label for="mode">Collaboration mode</label><select id="mode"><option value="fast">Fast — independent answers and synthesis</option><option value="deep">Deep — answers, peer reviews, and synthesis (higher API cost)</option><option value="research">Research — paid web search plus Fast synthesis</option><option value="research-deep">Research + Deep — paid web search and peer reviews</option></select><button id="askButton">Ask all models</button></form><h2>Combined answer</h2><pre id="combined">Your answer will appear here.</pre><section id="sourcesSection" hidden><h2>Research sources</h2><div id="sources"></div></section><h2>Individual responses</h2><div id="answers"></div><section id="reviewsSection" hidden><h2>Peer reviews</h2><div id="reviews"></div></section></section>
<p id="status" role="status"></p></main><script src="/app.js" defer></script></body></html>
